openapi: "3.1.0"
info:
  title: E-Commerce API
  description: |
    A comprehensive e-commerce API demonstrating REST best practices.
    This API provides endpoints for managing products, shopping carts,
    orders, and customer accounts.
  version: "2.0.0"
  contact:
    name: API Support
    email: api-support@example.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://api.example.com/v2
    description: Production
  - url: https://staging-api.example.com/v2
    description: Staging

tags:
  - name: products
    description: Product catalog management
  - name: categories
    description: Product categories
  - name: carts
    description: Shopping cart operations
  - name: orders
    description: Order management
  - name: customers
    description: Customer accounts
  - name: reviews
    description: Product reviews

paths:
  /products:
    get:
      tags:
        - products
      summary: List products
      description: Returns a paginated list of products with optional filtering
      operationId: listProducts
      parameters:
        - name: categoryId
          in: query
          description: Filter by category ID
          schema:
            type: string
            format: uuid
        - name: minPrice
          in: query
          description: Minimum price filter
          schema:
            type: number
            format: decimal
            minimum: 0
        - name: maxPrice
          in: query
          description: Maximum price filter
          schema:
            type: number
            format: decimal
        - name: inStock
          in: query
          description: Filter by stock availability
          schema:
            type: boolean
        - name: sortBy
          in: query
          description: Sort field
          schema:
            type: string
            enum:
              - name
              - price
              - createdAt
              - rating
            default: name
        - name: sortOrder
          in: query
          description: Sort direction
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
        - name: pageSize
          in: query
          description: Number of items per page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: pageToken
          in: query
          description: Token for pagination
          schema:
            type: string
      responses:
        "200":
          description: Product list retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductList"
        "400":
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

    post:
      tags:
        - products
      summary: Create a product
      description: Add a new product to the catalog
      operationId: createProduct
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductCreate"
      responses:
        "201":
          description: Product created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
          headers:
            Location:
              description: URL of the created product
              schema:
                type: string
                format: uri
        "400":
          description: Invalid product data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /products/{productId}:
    parameters:
      - name: productId
        in: path
        required: true
        description: Product unique identifier
        schema:
          type: string
          format: uuid

    get:
      tags:
        - products
      summary: Get product details
      description: Retrieve a single product by ID
      operationId: getProduct
      responses:
        "200":
          description: Product retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

    patch:
      tags:
        - products
      summary: Update product
      description: Partially update a product
      operationId: updateProduct
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Product updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: Invalid update data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

    delete:
      tags:
        - products
      summary: Delete product
      description: Remove a product from the catalog
      operationId: deleteProduct
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Product deleted successfully
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /products/{productId}/reviews:
    parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      tags:
        - reviews
      summary: List product reviews
      description: Get reviews for a specific product
      operationId: listProductReviews
      parameters:
        - name: rating
          in: query
          description: Filter by rating
          schema:
            type: integer
            minimum: 1
            maximum: 5
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Reviews retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewList"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

    post:
      tags:
        - reviews
      summary: Create a review
      description: Add a review for a product
      operationId: createProductReview
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewCreate"
      responses:
        "201":
          description: Review created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        "400":
          description: Invalid review data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /categories:
    get:
      tags:
        - categories
      summary: List categories
      description: Get all product categories
      operationId: listCategories
      responses:
        "200":
          description: Categories retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryList"

  /carts:
    post:
      tags:
        - carts
      summary: Create a cart
      description: Create a new shopping cart
      operationId: createCart
      responses:
        "201":
          description: Cart created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
          headers:
            Location:
              schema:
                type: string
                format: uri

  /carts/{cartId}:
    parameters:
      - name: cartId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      tags:
        - carts
      summary: Get cart
      description: Retrieve a shopping cart
      operationId: getCart
      responses:
        "200":
          description: Cart retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "404":
          description: Cart not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

    delete:
      tags:
        - carts
      summary: Delete cart
      description: Remove a shopping cart
      operationId: deleteCart
      responses:
        "204":
          description: Cart deleted successfully
        "404":
          description: Cart not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /carts/{cartId}/items:
    parameters:
      - name: cartId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    post:
      tags:
        - carts
      summary: Add item to cart
      description: Add a product to the shopping cart
      operationId: addCartItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CartItemCreate"
      responses:
        "201":
          description: Item added to cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "400":
          description: Invalid item data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: Cart or product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /orders:
    get:
      tags:
        - orders
      summary: List orders
      description: Get orders for the authenticated customer
      operationId: listOrders
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          description: Filter by order status
          schema:
            type: string
            enum:
              - pending
              - confirmed
              - shipped
              - delivered
              - cancelled
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Orders retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderList"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

    post:
      tags:
        - orders
      summary: Create order
      description: Place an order from a shopping cart
      operationId: createOrder
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderCreate"
      responses:
        "201":
          description: Order created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
          headers:
            Location:
              schema:
                type: string
                format: uri
        "400":
          description: Invalid order data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /orders/{orderId}:
    parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      tags:
        - orders
      summary: Get order details
      description: Retrieve a specific order
      operationId: getOrder
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Order retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /customers/me:
    get:
      tags:
        - customers
      summary: Get current customer
      description: Get the authenticated customer's profile
      operationId: getCurrentCustomer
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Customer profile retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

    patch:
      tags:
        - customers
      summary: Update current customer
      description: Update the authenticated customer's profile
      operationId: updateCurrentCustomer
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerUpdate"
      responses:
        "200":
          description: Customer profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "400":
          description: Invalid update data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

components:
  schemas:
    Product:
      type: object
      required:
        - id
        - name
        - price
        - currency
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        price:
          type: number
          format: decimal
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        categoryId:
          type: string
          format: uuid
        imageUrls:
          type: array
          items:
            type: string
            format: uri
        stockQuantity:
          type: integer
          minimum: 0
        isAvailable:
          type: boolean
        averageRating:
          type: number
          minimum: 0
          maximum: 5
        reviewCount:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ProductCreate:
      type: object
      required:
        - name
        - price
        - currency
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 5000
        price:
          type: number
          format: decimal
          minimum: 0
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        categoryId:
          type: string
          format: uuid
        imageUrls:
          type: array
          items:
            type: string
            format: uri
        stockQuantity:
          type: integer
          minimum: 0
          default: 0

    ProductUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
        price:
          type: number
          format: decimal
          minimum: 0
        categoryId:
          type: string
          format: uuid
        imageUrls:
          type: array
          items:
            type: string
            format: uri
        stockQuantity:
          type: integer
          minimum: 0
        isAvailable:
          type: boolean

    ProductList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        totalCount:
          type: integer
        nextPageToken:
          type: string

    Category:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        parentId:
          type: string
          format: uuid
        productCount:
          type: integer

    CategoryList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Category"

    Review:
      type: object
      required:
        - id
        - productId
        - customerId
        - rating
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        rating:
          type: integer
          minimum: 1
          maximum: 5
        title:
          type: string
        content:
          type: string
        isVerifiedPurchase:
          type: boolean
        createdAt:
          type: string
          format: date-time

    ReviewCreate:
      type: object
      required:
        - rating
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
        title:
          type: string
          maxLength: 100
        content:
          type: string
          maxLength: 2000

    ReviewList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Review"
        totalCount:
          type: integer
        averageRating:
          type: number

    Cart:
      type: object
      required:
        - id
        - items
      properties:
        id:
          type: string
          format: uuid
        items:
          type: array
          items:
            $ref: "#/components/schemas/CartItem"
        subtotal:
          type: number
          format: decimal
        currency:
          type: string
        itemCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CartItem:
      type: object
      required:
        - productId
        - quantity
      properties:
        productId:
          type: string
          format: uuid
        productName:
          type: string
        quantity:
          type: integer
          minimum: 1
        unitPrice:
          type: number
          format: decimal
        totalPrice:
          type: number
          format: decimal

    CartItemCreate:
      type: object
      required:
        - productId
        - quantity
      properties:
        productId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
          default: 1

    Order:
      type: object
      required:
        - id
        - customerId
        - status
        - items
      properties:
        id:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - pending
            - confirmed
            - shipped
            - delivered
            - cancelled
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        subtotal:
          type: number
          format: decimal
        tax:
          type: number
          format: decimal
        shipping:
          type: number
          format: decimal
        total:
          type: number
          format: decimal
        currency:
          type: string
        shippingAddress:
          $ref: "#/components/schemas/Address"
        billingAddress:
          $ref: "#/components/schemas/Address"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    OrderItem:
      type: object
      required:
        - productId
        - quantity
        - unitPrice
      properties:
        productId:
          type: string
          format: uuid
        productName:
          type: string
        quantity:
          type: integer
        unitPrice:
          type: number
          format: decimal
        totalPrice:
          type: number
          format: decimal

    OrderCreate:
      type: object
      required:
        - cartId
        - shippingAddress
      properties:
        cartId:
          type: string
          format: uuid
        shippingAddress:
          $ref: "#/components/schemas/Address"
        billingAddress:
          $ref: "#/components/schemas/Address"

    OrderList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Order"
        totalCount:
          type: integer

    Customer:
      type: object
      required:
        - id
        - email
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
        defaultShippingAddress:
          $ref: "#/components/schemas/Address"
        defaultBillingAddress:
          $ref: "#/components/schemas/Address"
        isEmailVerified:
          type: boolean
        createdAt:
          type: string
          format: date-time

    CustomerUpdate:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
        defaultShippingAddress:
          $ref: "#/components/schemas/Address"
        defaultBillingAddress:
          $ref: "#/components/schemas/Address"

    Address:
      type: object
      required:
        - line1
        - city
        - country
      properties:
        line1:
          type: string
        line2:
          type: string
        city:
          type: string
        state:
          type: string
        postalCode:
          type: string
        country:
          type: string
          pattern: "^[A-Z]{2}$"

    ProblemDetails:
      type: object
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri
          description: A URI reference identifying the problem type
        title:
          type: string
          description: A short human-readable summary
        status:
          type: integer
          description: HTTP status code
        detail:
          type: string
          description: Human-readable explanation
        instance:
          type: string
          format: uri
          description: URI reference for this specific occurrence
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
